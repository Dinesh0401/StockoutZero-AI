<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StockoutZero AI</title>
  <style>
    :root { color-scheme: light; --ink:#182230; --blue:#1457a6; --line:#dce4ef; --bg:#f4f7fb; }
    * { box-sizing:border-box; } body { margin:0; font-family:Inter,Segoe UI,sans-serif; color:var(--ink); background:var(--bg); }
    header { background:white; border-bottom:1px solid var(--line); padding:18px 32px; font-weight:750; }
    main { max-width:1000px; margin:32px auto; padding:0 20px; display:grid; grid-template-columns:1fr 1fr; gap:20px; }
    section { background:white; border:1px solid var(--line); border-radius:14px; padding:22px; box-shadow:0 8px 24px rgba(26,54,93,.06); }
    h1,h2 { margin-top:0; } textarea,input { width:100%; border:1px solid var(--line); border-radius:8px; padding:10px; font:inherit; }
    textarea { min-height:220px; resize:vertical; }     .controls { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:12px 0; }
    button { border:0; border-radius:8px; background:var(--blue); color:white; padding:11px 16px; font-weight:700; cursor:pointer; }
    button:hover { background:#0d477f; } #result { white-space:pre-wrap; line-height:1.6; }
    .metric { font-size:38px; color:var(--blue); font-weight:800; } .muted { color:#66758a; }
    @media(max-width:760px){ main{grid-template-columns:1fr;} }
  </style>
</head>
<body>
<header>StockoutZero AI <span class="muted">· Research inventory demo</span></header>
<main>
  <section>
    <h1>Inventory observations</h1>
    <p class="muted">Enter one JSON observation per line. Use <code>null</code for unknown stock.</p>
    <textarea id="input">[
  {"sales":20,"available_stock":25},
  {"sales":10,"available_stock":10},
  {"sales":0,"available_stock":0},
  {"sales":22,"available_stock":30}
]</textarea>
    <div class="controls">
      <label>Merchant tenant<input id="tenant" type="text" value="demo-merchant"></label>
      <label>Lead days<input id="lead" type="number" value="7" min="1"></label>
      <label>On hand<input id="hand" type="number" value="0" min="0"></label>
      <label>Case pack<input id="pack" type="number" value="1" min="1"></label>
    </div>
    <button id="run">Estimate & recommend</button>
  </section>
  <section>
    <h2>Decision result</h2>
    <div id="result" class="muted">Run an estimate to see demand uncertainty and a reorder quantity.</div>
  </section>
</main>
<script>
document.querySelector('#run').addEventListener('click', async () => {
  const result = document.querySelector('#result');
  try {
    const observations = JSON.parse(document.querySelector('#input').value);
    const response = await fetch('/recommend', {method:'POST', headers:{
      'Content-Type':'application/json',
      'X-Tenant-ID':document.querySelector('#tenant').value
    }, body:JSON.stringify({
      observations,
      lead_time_days:Number(document.querySelector('#lead').value),
      on_hand:Number(document.querySelector('#hand').value),
      case_pack:Number(document.querySelector('#pack').value)
    })});
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || 'Request failed');
    result.className = '';
    const reorder = data.suggested_units === null ? 'No safe reorder quantity' : `${data.suggested_units} units`;
    result.innerHTML = `<div class="metric">${reorder}</div><strong>Suggested reorder</strong><br><br>`+
      `Estimated demand: ${data.estimated_daily_demand === null ? 'Not identifiable' : data.estimated_daily_demand + ' units/day'}<br>`+
      `Forecast range: ${data.p10 === null ? 'Unavailable' : data.p10 + '–' + data.p90 + ' units/day'}<br>`+
      `Censored observations: ${data.censored_observations} of ${data.usable_observations}<br>`+
      (data.warning ? `<br>⚠ ${data.warning}` : '');
  } catch (error) { result.className=''; result.textContent = 'Error: ' + error.message; }
});
</script>
</body>
</html>
